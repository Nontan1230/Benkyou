<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 to GIF Converter</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17191f;color:#f2f3f7;font-family:Arial,sans-serif;padding:30px}
main{max-width:850px;margin:auto}
h1{font-size:28px;margin-bottom:8px}
.sub{color:#9da3b2;margin-bottom:25px}
.panel{background:#222630;border:1px solid #353b49;border-radius:14px;padding:22px;margin:16px 0}
button,.filebtn{background:#8b7cff;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=file]{display:none}
video{width:100%;max-height:380px;background:#08090c;border-radius:9px;margin-top:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
label{display:block;color:#bfc4d0;font-size:13px;margin-bottom:7px}
input[type=number],input[type=range]{width:100%}
input[type=number]{background:#171a21;color:white;border:1px solid #454c5b;padding:10px;border-radius:7px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#status{color:#bcb4ff;margin-top:15px;white-space:pre-wrap}
#preview{max-width:100%;margin-top:15px;border-radius:8px}
a{color:#bcb4ff}
@media(max-width:550px){body{padding:15px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>MP4 → GIF Converter</h1>
<div class="sub">動画をGIFアニメーションに変換</div>

<section class="panel">
<label class="filebtn" for="file">MP4ファイルを選択</label>
<input id="file" type="file" accept="video/mp4,video/*">
<video id="video" controls></video>
<div id="filename" class="sub">動画が選択されていません</div>
</section>

<section class="panel">
<h3>変換設定</h3>
<div class="grid">
<div><label>開始時間（秒）</label><input id="start" type="number" min="0" value="0" step="0.1"></div>
<div><label>終了時間（秒）</label><input id="end" type="number" min="0" value="3" step="0.1"></div>
<div><label>GIFの幅（px）</label><input id="width" type="number" min="50" max="1200" value="480"></div>
<div><label>FPS</label><input id="fps" type="number" min="1" max="30" value="12"></div>
</div>
<div class="actions">
<button id="convert" disabled>GIFに変換する</button>
</div>
<div id="status">動画を読み込んでください。</div>
</section>

<section class="panel">
<h3>変換結果</h3>
<img id="preview" hidden>
<div class="actions">
<a id="download" hidden download="converted.gif">GIFを保存</a>
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.js"></script>
<script>
const fileInput=document.getElementById('file');
const video=document.getElementById('video');
const convert=document.getElementById('convert');
const status=document.getElementById('status');
const preview=document.getElementById('preview');
const download=document.getElementById('download');
let videoURL=null;

fileInput.addEventListener('change',()=>{
 const file=fileInput.files[0];
 if(!file)return;
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=URL.createObjectURL(file);
 video.src=videoURL;
 document.getElementById('filename').textContent=file.name;
 video.onloadedmetadata=()=>{
  document.getElementById('start').value=0;
  document.getElementById('end').value=Math.min(3,video.duration).toFixed(1);
  convert.disabled=false;
  status.textContent='動画を読み込みました。';
 };
});

convert.addEventListener('click',async()=>{
 if(typeof GIF==='undefined'){
  status.textContent='変換エンジンを読み込めませんでした。インターネット接続を確認してください。';
  return;
 }
 const start=Number(document.getElementById('start').value);
 const end=Number(document.getElementById('end').value);
 const width=Number(document.getElementById('width').value);
 const fps=Number(document.getElementById('fps').value);

 if(!video.src||end<=start||start<0||end>video.duration||width<50||fps<1){
  status.textContent='設定値を確認してください。';
  return;
 }
 if(end-start>20){
  status.textContent='一度に変換できる長さは20秒までです。';
  return;
 }

 convert.disabled=true;
 preview.hidden=true;
 download.hidden=true;
 status.textContent='GIFを作成しています...';

 try{
  const ratio=video.videoHeight/video.videoWidth;
  const height=Math.max(1,Math.round(width*ratio));
  const canvas=document.createElement('canvas');
  canvas.width=width;
  canvas.height=height;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  const gif=new GIF({
   workers:2,
   quality:10,
   width,
   height,
   workerScript:'https://cdn.jsdelivr.net/npm/gif.js.optimized/dist/gif.worker.js'
  });
  const total=Math.floor((end-start)*fps);
  const frameDelay=1000/fps;

  for(let i=0;i<total;i++){
   const time=start+i/fps;
   await new Promise((resolve,reject)=>{
    const onSeek=()=>{video.removeEventListener('seeked',onSeek);resolve()};
    video.addEventListener('seeked',onSeek);
    video.currentTime=time;
    setTimeout(()=>{
     video.removeEventListener('seeked',onSeek);
     resolve();
    },2000);
   });
   ctx.drawImage(video,0,0,width,height);
   gif.addFrame(ctx,{copy:true,delay:frameDelay});
   status.textContent=`フレームを準備中... ${i+1}/${total}`;
  }

  gif.on('progress',p=>{
   status.textContent=`GIFを生成中... ${Math.round(p*100)}%`;
  });
  gif.on('finished',blob=>{
   const url=URL.createObjectURL(blob);
   preview.src=url;
   preview.hidden=false;
   download.href=url;
   download.hidden=false;
   status.textContent='変換完了！GIFを保存できます。';
   download.click();
   convert.disabled=false;
  });
  gif.on('error',err=>{
   status.textContent='変換エラー: '+err;
   convert.disabled=false;
  });
  gif.render();
 }catch(err){
  status.textContent='エラー: '+err.message;
  convert.disabled=false;
 }
});
</script>
</body>
</html>
