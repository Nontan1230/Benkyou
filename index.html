<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集中勉強タイマー ＆ カレンダー記録</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #f0f4f8;
            color: #333;
            padding: 30px 10px;
            margin: 0;
            overflow: hidden;
        }
        .container {
            max-width: 450px;
            margin: 0 auto 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: #2b6cb0; margin-top: 0; }
        .setting-box { margin: 20px 0; }
        select { padding: 10px; font-size: 1.1rem; border-radius: 5px; width: 100%; border: 1px solid #cbd5e0; }
        .point-box, .timer-box { font-size: 2.2rem; font-weight: bold; margin: 15px 0; }
        .point-box { color: #dd6b20; }
        .timer-box { color: #4a5568; }
        button {
            background-color: #3182ce; color: white; border: none; padding: 15px 30px;
            font-size: 1.2rem; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%;
        }
        button:hover { background-color: #2b6cb0; }
        button:disabled { background-color: #cbd5e0; cursor: not-allowed; }
        .alert { color: #e53e3e; font-weight: bold; margin-top: 15px; font-size: 1.1rem; min-height: 50px; }
        .countdown-overlay { font-size: 3.5rem; color: #e53e3e; font-weight: bold; margin: 15px 0; display: none; }
        
        .history-container { max-width: 450px; margin: 0 auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: left; }
        .history-title { font-size: 1.3rem; font-weight: bold; color: #2c5282; border-bottom: 2px solid #ebf8ff; padding-bottom: 8px; margin-bottom: 15px; }
        .history-list { list-style: none; padding: 0; margin: 0; max-height: 250px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 5px; border-bottom: 1px solid #edf2f7; font-size: 1.1rem; }
        .history-date { font-weight: bold; color: #4a5568; }
        .history-pts { font-weight: bold; color: #dd6b20; }

        /* 💡 マウス移動を偽装するためのダミー要素 */
        #mouse-fake-area {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="mouse-fake-area"></div>

<div class="container">
    <h1>🔥 集中勉強タイマー</h1>
    <p>スタートしたら画面を触ったり別タブを開いたりしないでください！</p>
    
    <div class="setting-box" id="setting-area">
        <label for="time-select" style="font-weight: bold; display:block; margin-bottom:5px;">集中する時間を選択：</label>
        <select id="time-select">
            <option value="10">10 分間</option>
            <option value="20">20 分間</option>
            <option value="30" selected>30 分間</option>
            <option value="45">45 分間</option>
            <option value="60">60 分間</option>
            <option value="90">90 分間</option>
        </select>
    </div>

    <div id="countdown" class="countdown-overlay">3</div>
    <div class="timer-box">残り時間: <span id="timer">--:--</span></div>
    <div class="point-box">現在のポイント: <span id="points">0</span> pt</div>
    
    <button id="start-btn">集中をスタート！</button>
    <div id="status-msg" class="alert"></div>
</div>

<div class="history-container">
    <div class="history-title">📅 日別の獲得ポイント記録</div>
    <ul id="history-list" class="history-list"></ul>
</div>

<script>
    let timerInterval;
    let pointInterval;
    let countdownInterval;
    let moveMouseInterval; // 💡 擬似マウス移動用
    let wakeLock = null;
    
    let defaultMinutes = 30;
    let timeLeft = defaultMinutes * 60;
    let currentSessionPoints = 0;
    let isRunning = false;
    let isMonitoring = false;
    
    let fakeToggle = false; 
    let lastFakeTime = 0; // 💡 自分が起こしたイベントを区別するため

    const timerEl = document.getElementById('timer');
    const pointsEl = document.getElementById('points');
    const startBtn = document.getElementById('start-btn');
    const statusMsg = document.getElementById('status-msg');
    const countdownEl = document.getElementById('countdown');
    const timeSelect = document.getElementById('time-select');
    const settingArea = document.getElementById('setting-area');
    const historyListEl = document.getElementById('history-list');
    const fakeArea = document.getElementById('mouse-fake-area');

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); }
    }

    function getTodayString() {
        const today = new Date();
        return `${today.getFullYear()}/${(today.getMonth() + 1).toString().padStart(2, '0')}/${today.getDate().toString().padStart(2, '0')}`;
    }

    // 履歴読み込み・保存
    function loadHistory() {
        historyListEl.innerHTML = '';
        const historyData = JSON.parse(localStorage.getItem('study_points_history')) || {};
        const sortedDates = Object.keys(historyData).sort((a, b) => b.localeCompare(a));
        if (sortedDates.length === 0) {
            historyListEl.innerHTML = '<li class="history-item" style="color:#94a3b8;">まだ記録はありません。</li>';
            return;
        }
        sortedDates.forEach(date => {
            const li = document.createElement('li');
            li.className = 'history-item';
            li.innerHTML = `<span class="history-date">${date}</span><span class="history-pts">${historyData[date]} pt</span>`;
            historyListEl.appendChild(li);
        });
    }

    function savePointsToHistory(ptsChange, isReset = false) {
        const todayStr = getTodayString();
        let historyData = JSON.parse(localStorage.getItem('study_points_history')) || {};
        if (!historyData[todayStr]) historyData[todayStr] = 0;
        if (isReset) { historyData[todayStr] = 0; } else { historyData[todayStr] += ptsChange; }
        localStorage.setItem('study_points_history', JSON.stringify(historyData));
        loadHistory();
    }

    startBtn.addEventListener('click', () => {
        defaultMinutes = parseInt(timeSelect.value);
        timeLeft = defaultMinutes * 60;
        startBtn.disabled = true;
        settingArea.style.opacity = "0.4";
        timeSelect.disabled = true;
        statusMsg.textContent = "📢 マウスから手を離し、キーボードに触らないでください！";
        statusMsg.style.color = "#e53e3e";
        countdownEl.style.display = "block";
        
        let count = 3;
        countdownEl.textContent = count;
        countdownInterval = setInterval(() => {
            count--;
            if (count > 0) { countdownEl.textContent = count; } else {
                clearInterval(countdownInterval);
                countdownEl.style.display = "none";
                actualStart();
            }
        }, 1000);
    });

    async function actualStart() {
        isRunning = true;
        isMonitoring = true;
        currentSessionPoints = 0;
        pointsEl.textContent = currentSessionPoints;
        statusMsg.textContent = "⏳ 集中時間中... 触っちゃダメ！";
        statusMsg.style.color = "#dd6b20";

        await requestWakeLock();

        // 💡【最重要】1秒ごとにブラウザ内で「マウス移動イベント」を発生させてWindowsの30秒ロックを破壊する
        moveMouseInterval = setInterval(() => {
            fakeToggle = !fakeToggle;
            const fakeEvent = new MouseEvent('mousemove', {
                clientX: fakeToggle ? 100 : 101, // 1ピクセルだけ位置を動かす
                clientY: fakeToggle ? 100 : 101,
                bubbles: true
            });
            lastFakeTime = Date.now(); // 💡「今プログラムが動かしたよ」という時間を記録
            fakeArea.dispatchEvent(fakeEvent);
        }, 1000);

        timerInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            if (timeLeft <= 0) { endSession(true); }
        }, 1000);

        pointInterval = setInterval(() => {
            currentSessionPoints += 1;
            pointsEl.textContent = currentSessionPoints;
        }, 5000);
    }

    // 🚨 誘惑に負けた（ペナルティ）の処理
    function penalty(e) {
        if (!isMonitoring) return;

        // 💡 プログラム自身が10ミリ秒以内に発生させたマウス移動イベントなら、ペナルティにせずスルーする
        if (e.type === 'mousemove' && (Date.now() - lastFakeTime < 10)) {
            return; 
        }
        
        savePointsToHistory(0, true);
        currentSessionPoints = 0;
        pointsEl.textContent = currentSessionPoints;
        statusMsg.textContent = "🚨 あ！PCを操作しましたね？本日の獲得ポイントが0にリセットされました！";
        statusMsg.style.color = "#e53e3e";
        endSession(false);
    }

    function endSession(isSuccess) {
        clearInterval(timerInterval);
        clearInterval(pointInterval);
        clearInterval(moveMouseInterval); // 💡 擬似マウス移動を停止
        releaseWakeLock();
        
        isRunning = false;
        isMonitoring = false;
        startBtn.disabled = false;
        timeSelect.disabled = false;
        settingArea.style.opacity = "1";
        timerEl.textContent = "--:--";
        
        if (isSuccess) {
            savePointsToHistory(currentSessionPoints, false);
            statusMsg.textContent = `🎉 おめでとうございます！集中達成で ${currentSessionPoints} pt 獲得しました！`;
            statusMsg.style.color = "#38a169";
        }
    }

    // 💡 本物の人間が触ったかどうかを検知（キーボード入力もペナルティ対象に追加）
    window.addEventListener('click', penalty);
    window.addEventListener('touchstart', penalty);
    window.addEventListener('keydown', penalty); // キーボードを叩いてもアウト
